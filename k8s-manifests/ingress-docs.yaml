apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: docs.local
    http:
      paths:
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /openapi\.json
        pathType: ImplementationSpecific
        backend:
          service:
            name: api-gateway
            port:
              number: 8080