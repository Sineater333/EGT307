apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard-ui
        image: taiweien/egt307-dashboard:v4 
        ports:
        - containerPort: 8501
        
        # --- RESOURCE MANAGEMENT ---
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

        # --- HEALTH CHECKS (SELF-HEALING) ---
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 15  # Streamlit needs a bit of time to spin up
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 10

        env:
        - name: GATEWAY_URL
          value: "http://api-gateway:8080/route/predict" 
        - name: DB_HISTORY_URL
          value: "http://database-service:8000/history" 
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: dashboard
  ports:
  - protocol: TCP
    port: 8501
    targetPort: 8501
  type: ClusterIP