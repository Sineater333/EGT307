# 1. DB WRAPPER SERVICE (The Python Logic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
    spec:
      containers:
      - name: database-service
        image: taiweien/egt307-database:v2 
        ports:
        - containerPort: 8000
        
        # --- RESOURCE MANAGEMENT ---
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        # --- HEALTH CHECKS ---
        # Readiness: Don't let other services talk to the DB until Python is up
        readinessProbe:
          httpGet:
            path: /health  
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        
        # Liveness: Restart if the DB connection hangs or the service crashes
        livenessProbe:
          httpGet:
            path: /health  
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20

        env:
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              name: mongodb-atlas-secret
              key: ATLAS_URL  # Ensure this matches the key name in the .env
---
# 2. DB SERVICE WRAPPER (INTERNAL DNS)
apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  selector:
    app: database-service
  ports:
    - port: 8000
      targetPort: 8000