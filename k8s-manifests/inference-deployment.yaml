apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-deployment
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
      - name: inference-api
        image: taiweien/egt307-inference:v3 
        
        # --- RESOURCE MANAGEMENT for HPA ---
        resources:
          requests:
            cpu: "100m"  # HPA uses this as the 100% baseline for scaling
            memory: "128Mi"
          limits:
            cpu: "200m"  
            memory: "256Mi"

        # --- HEALTH CHECKS (Self-Healing) ---
        livenessProbe:
          httpGet:
            path: /health       
            port: 8000
          initialDelaySeconds: 30 # Allows the ML model time to load
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10

        ports:
        - containerPort: 8000
        env:
        - name: DB_SERVICE_URL
          value: "http://database-service:8000/logs"

---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
spec:
  selector:
    app: inference
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP